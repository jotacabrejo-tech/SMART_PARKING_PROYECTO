# ==============================================================================
# SMART PARKING - CONFIGURACIÓN DE SPRING BOOT
# Evidencia SENA GA7-220501096-AA5-EV04: API del proyecto
# ==============================================================================

# Puerto HTTP del servidor embebido
server.port=8080

# Identificador de la aplicación
spring.application.name=smart-parking-backend

# Codificación estándar UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Configuración de Documentación OpenAPI 3 / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
